<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Rota e Combustível</title>
  
  <!-- Estilos do Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      padding: 15px;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #1a252f;
      text-align: center;
    }

    /* Grid do Formulário */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: #495057;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #007bff;
      outline: none;
    }

    input:disabled {
      background-color: #e9ecef;
      color: #6c757d;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.99);
    }

    button.secundario {
      background-color: #007bff;
    }

    button.limpar {
      background-color: #dc3545;
    }

    button:hover {
      opacity: 0.92;
    }

    /* Container de Resultados e Mapa */
    .resultado-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .resultado {
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 6px solid #28a745;
    }

    .resultado h3 {
      margin-bottom: 15px;
      color: #155724;
      font-size: 1.2rem;
    }

    .resultado p {
      margin-bottom: 8px;
      font-size: 1rem;
    }

    .aviso-reserva {
      color: #856404;
      background-color: #fff3cd;
      border: 1px solid #ffeeba;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      margin-top: 15px;
    }

    #map {
      height: 350px;
      width: 100%;
      border-radius: 8px;
      border: 1px solid #dee2e6;
    }

    /* --- RESPONSIVIDADE (Desktop e Tablets Grandes) --- */
    @media (min-width: 768px) {
      body {
        padding: 40px 20px;
      }

      h2 {
        font-size: 1.8rem;
        margin-bottom: 25px;
      }

      /* Formulário em 2 Colunas */
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }

      .form-group.full-width {
        grid-column: span 2;
      }

      .btn-group {
        flex-direction: row;
      }

      .btn-group button {
        width: auto;
      }

      /* Tela de Resultado Lado a Lado no PC */
      .resultado-wrapper {
        display: grid;
        grid-template-columns: 380px 1fr;
        align-items: start;
      }

      #map {
        height: 450px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Calculadora de Combustível</h2>

  <!-- ÁREA DO FORMULÁRIO -->
  <div id="secaoFormulario">
    <div class="form-grid">
      <!-- Ponto A -->
      <div class="form-group full-width">
        <label for="pontoA">Ponto A (Origem):</label>
        <input type="text" id="pontoA" placeholder="Digite o endereço ou use o GPS abaixo">
        <div class="btn-group">
          <button type="button" class="secundario" onclick="usarGPS()">Usar minha localização atual (GPS)</button>
        </div>
      </div>

      <!-- Ponto B (Opcional) -->
      <div class="form-group">
        <label for="pontoB">Ponto B (Parada Intermediária - Opcional):</label>
        <input type="text" id="pontoB" placeholder="Deixe em branco se for direto para a Base">
      </div>

      <!-- Ponto C (Fixo) -->
      <div class="form-group">
        <label for="pontoC">Ponto C (Destino Fixo):</label>
        <input type="text" id="pontoC" value="Capela Velha, Araucária - PR" disabled>
      </div>

      <!-- Média de Combustível -->
      <div class="form-group">
        <label for="mediaKml">Média de consumo do veículo (Km/L):</label>
        <input type="number" id="mediaKml" placeholder="Ex: 2,5" value="2.5" step="0.1">
      </div>

      <!-- Quantidade atual no tanque -->
      <div class="form-group">
        <label for="tanqueAtual">Combustível atual no tanque (Litros):</label>
        <input type="number" id="tanqueAtual" placeholder="Ex: 200" step="0.1">
      </div>
    </div>

    <div class="btn-group" style="margin-top: 20px;">
      <button type="button" onclick="iniciarCalculo()">Calcular Rota e Combustível</button>
    </div>
  </div>

  <!-- ÁREA DO RESULTADO + MAPA -->
  <div id="secaoResultado" style="display: none;">
    <div class="resultado-wrapper">
      <!-- Painel de Dados -->
      <div class="resultado">
        <h3>Resultado do Percurso</h3>
        <p><strong>Trajeto:</strong> <span id="resumoTrajeto">--</span></p>
        <p><strong>Distância Total:</strong> <span id="distancia">--</span> km</p>
        <p><strong>Consumo Estimado:</strong> <span id="litrosPercurso">--</span> Litros</p>
        <p><strong>Reserva Adicionada:</strong> +100 Litros</p>
        <p><strong>No Tanque (Deduzido):</strong> -<span id="tanqueDeduzido">0</span> Litros</p>
        <hr style="margin: 12px 0;">
        <p style="font-size: 1.2rem; color: #155724;">
          <strong>Total a Abastecer:</strong> <span id="litrosFinais">--</span> Litros
        </p>
        
        <div class="aviso-reserva">
          ℹ️ <strong>Nota:</strong> O valor inclui a margem fixa de <strong>100L de reserva de segurança</strong>.
        </div>

        <button type="button" class="limpar" onclick="limparConsulta()" style="margin-top: 20px;">Nova Consulta</button>
      </div>

      <!-- Mapa -->
      <div id="map"></div>
    </div>
  </div>

</div>

<!-- JS do Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const PONTO_C = { lat: -25.5685, lng: -49.3888 }; 

  let map = null;
  let rotaLayer = null;
  let marcadores = [];

  function inicializarMapa() {
    if (!map) {
      map = L.map('map').setView([PONTO_C.lat, PONTO_C.lng], 12);
      
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
      }).addTo(map);
    }
  }

  function usarGPS() {
    if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
      alert("Atenção: A geolocalização no celular exige conexão segura (HTTPS).");
    }

    if ("geolocation" in navigator) {
      const opcoes = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };

      navigator.geolocation.getCurrentPosition(
        position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          document.getElementById('pontoA').value = `${lat}, ${lng}`;
          alert("Localização obtida com sucesso!");
        },
        error => {
          switch(error.code) {
            case error.PERMISSION_DENIED:
              alert("Erro: Permissão para acessar o GPS foi negada.");
              break;
            case error.POSITION_UNAVAILABLE:
              alert("Erro: GPS indisponível ou desligado.");
              break;
            case error.TIMEOUT:
              alert("Erro: Tempo limite excedido para obter localização.");
              break;
            default:
              alert("Erro ao obter localização: " + error.message);
              break;
          }
        },
        opcoes
      );
    } else {
      alert("Seu navegador não suporta geolocalização.");
    }
  }

  function iniciarCalculo() {
    const tanqueInput = document.getElementById('tanqueAtual').value.trim();

    if (tanqueInput === "" || parseFloat(tanqueInput) < 0) {
      const confirmar = confirm(
        "Atenção: Você não informou a quantidade de combustível atual no tanque.\n\n" +
        "• Clique em 'OK' para prosseguir considerando 0 Litros no tanque.\n" +
        "• Clique em 'Cancelar' para voltar e digitar a quantidade."
      );

      if (!confirmar) {
        document.getElementById('tanqueAtual').focus();
        return;
      }
    }

    calcularRota();
  }

  async function geocodificar(endereco) {
    if (endereco.includes(',')) {
      const [lat, lng] = endereco.split(',').map(n => parseFloat(n.trim()));
      if (!isNaN(lat) && !isNaN(lng)) return { lat, lng };
    }

    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(endereco)}`;
    const response = await fetch(url);
    const data = await response.json();

    if (!data || data.length === 0) {
      throw new Error(`Endereço não encontrado: ${endereco}`);
    }

    return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
  }

  async function calcularRota() {
    const enderecoA = document.getElementById('pontoA').value.trim();
    const enderecoB = document.getElementById('pontoB').value.trim();
    const mediaKml = parseFloat(document.getElementById('mediaKml').value);
    const tanqueAtual = parseFloat(document.getElementById('tanqueAtual').value) || 0;

    if (!enderecoA || !mediaKml || mediaKml <= 0) {
      alert("Por favor, preencha ao menos a Origem (Ponto A) e a Média do veículo.");
      return;
    }

    try {
      const coordA = await geocodificar(enderecoA);
      const coordC = PONTO_C;
      let coordB = null;
      let urlOSRM = '';
      let resumoTrajeto = '';

      if (enderecoB !== '') {
        coordB = await geocodificar(enderecoB);
        urlOSRM = `https://router.project-osrm.org/route/v1/driving/${coordA.lng},${coordA.lat};${coordB.lng},${coordB.lat};${coordC.lng},${coordC.lat}?overview=full&geometries=geojson`;
        resumoTrajeto = "Ponto A ➔ Ponto B ➔ Base Araucária";
      } else {
        urlOSRM = `https://router.project-osrm.org/route/v1/driving/${coordA.lng},${coordA.lat};${coordC.lng},${coordC.lat}?overview=full&geometries=geojson`;
        resumoTrajeto = "Ponto A ➔ Base Araucária (Direto)";
      }

      const res = await fetch(urlOSRM);
      const data = await res.json();

      if (data.code !== "Ok") {
        alert("Erro ao calcular a rota. Verifique os endereços informados.");
        return;
      }

      const distanciaMetros = data.routes[0].distance;
      const distanciaKm = (distanciaMetros / 1000).toFixed(2);
      const litrosPercurso = parseFloat((distanciaKm / mediaKml).toFixed(2));
      const MARGEM_RESERVA = 100;

      let totalAbastecer = (litrosPercurso + MARGEM_RESERVA) - tanqueAtual;
      if (totalAbastecer < 0) totalAbastecer = 0;

      document.getElementById('secaoFormulario').style.display = 'none';
      document.getElementById('secaoResultado').style.display = 'block';

      document.getElementById('resumoTrajeto').innerText = resumoTrajeto;
      document.getElementById('distancia').innerText = distanciaKm;
      document.getElementById('litrosPercurso').innerText = litrosPercurso.toFixed(2);
      document.getElementById('tanqueDeduzido').innerText = tanqueAtual.toFixed(2);
      document.getElementById('litrosFinais').innerText = totalAbastecer.toFixed(2);

      inicializarMapa();
      
      setTimeout(() => {
        map.invalidateSize();
        
        let pontosArray = [coordA];
        let titulosArray = ["Ponto A (Origem)"];

        if (coordB) {
          pontosArray.push(coordB);
          titulosArray.push("Ponto B (Parada)");
        }

        pontosArray.push(coordC);
        titulosArray.push("Ponto C (Capela Velha)");

        desenharNoMapa(data.routes[0].geometry, pontosArray, titulosArray);
      }, 100);

    } catch (err) {
      alert(err.message);
    }
  }

  function desenharNoMapa(geojson, pontos, titulos) {
    if (rotaLayer) map.removeLayer(rotaLayer);
    marcadores.forEach(m => map.removeLayer(m));
    marcadores = [];

    rotaLayer = L.geoJSON(geojson, {
      style: { color: '#007bff', weight: 5, opacity: 0.7 }
    }).addTo(map);

    pontos.forEach((p, index) => {
      const m = L.marker([p.lat, p.lng]).addTo(map).bindPopup(titulos[index]);
      marcadores.push(m);
    });

    map.fitBounds(rotaLayer.getBounds(), { padding: [30, 30] });
  }

  function limparConsulta() {
    document.getElementById('pontoA').value = '';
    document.getElementById('pontoB').value = '';
    document.getElementById('mediaKml').value = '10';
    document.getElementById('tanqueAtual').value = '';

    document.getElementById('secaoResultado').style.display = 'none';
    document.getElementById('secaoFormulario').style.display = 'block';

    if (rotaLayer) map.removeLayer(rotaLayer);
    marcadores.forEach(m => map.removeLayer(m));
    marcadores = [];
  }
</script>

</body>
</html>
